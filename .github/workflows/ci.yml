name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Detekt, test and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Format source before linting
        run: gradle ktlintFormat --no-daemon
      - name: Lint, Detekt, test and verify coverage
        run: gradle ktlintCheck detekt test jacocoTestReport jacocoTestCoverageVerification --no-daemon
        env:
          ENVIRONMENT: test
          GOOGLE_CLOUD_PROJECT: test-project
          GOOGLE_CLOUD_LOCATION: us-central1
          GEMINI_MODEL: test-model
      - name: Analyze and publish coverage to SonarCloud
        run: gradle sonar --no-daemon
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ENVIRONMENT: test
          GOOGLE_CLOUD_PROJECT: test-project
          GOOGLE_CLOUD_LOCATION: us-central1
          GEMINI_MODEL: test-model

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v3.12.0
      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dccacbed38856d5c2c0a7bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: super-planner-ai-gateway:ci
